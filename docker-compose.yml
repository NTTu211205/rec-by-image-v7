name: recommend-by-image-v5

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: recommend-by-image-api:5.0.0
    container_name: recommend-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api/app:/app/app:ro
      - ./api/artifacts:/app/artifacts:ro
    environment:
      # Model Grounding DINO (Apache-2.0) + hai file ma trận bắt buộc:
      MODEL_PATH: IDEA-Research/grounding-dino-tiny
      MODEL_CONFIDENCE: "0.3"
      MODEL_TEXT_THRESHOLD: "0.25"
      COOCCURRENCE_MATRIX_PATH: artifacts/matrix/cooccurrence_matrix.json
      CATEGORY_ROOM_SCORES_PATH: artifacts/matrix/category_room_scores.json

      # Catalog sản phẩm: kết nối PostgreSQL db_dmx (container dmx_postgres)
      DB_HOST: ${DB_HOST:-dmx_postgres}
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: ${DB_NAME:-db_dmx}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SCHEMA: ${DB_SCHEMA:-public}

      # Container không có GPU -> luôn CPU.
      MODEL_DEVICE: cpu
      # Hạ resize mặc định của Grounding DINO (800/1333) để giảm CPU latency.
      DETECT_SHORTEST_EDGE: "${DETECT_SHORTEST_EDGE:-384}"
      DETECT_LONGEST_EDGE: "${DETECT_LONGEST_EDGE:-640}"
      # Cell 9: đối chiếu class checkpoint với cooccurrence_matrix.json.
      REQUIRE_CLASS_MATCH: "true"

      # Ghi đè tham số gợi ý khi cần, không phải build lại image.
      DEFAULT_ROOM_TYPE: "${DEFAULT_ROOM_TYPE:-living_room}"
      DEFAULT_TOP_K: "${DEFAULT_TOP_K:-10}"
      DEFAULT_MIN_SCORE: "${DEFAULT_MIN_SCORE:-0.05}"
      PRODUCTS_PER_GROUP: "${PRODUCTS_PER_GROUP:-3}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-10}"

      # Qwen Image Edit Gateway (đọc từ .env)
      QWEN_GATEWAY_URL: "${QWEN_GATEWAY_URL}"
      QWEN_API_KEY: "${QWEN_API_KEY}"
      QWEN_GATEWAY_TIMEOUT_S: "${QWEN_GATEWAY_TIMEOUT_S:-60.0}"
      QWEN_GATEWAY_CONNECT_TIMEOUT_S: "${QWEN_GATEWAY_CONNECT_TIMEOUT_S:-10.0}"
      QWEN_MAX_CONCURRENT_EDITS: "${QWEN_MAX_CONCURRENT_EDITS:-2}"
      AUTO_GENERATE_IMAGE: "${AUTO_GENERATE_IMAGE:-false}"

      DOCS_ENABLED: "${DOCS_ENABLED:-true}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    networks:
      - default
      - dmx_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 10s

networks:
  default:
  dmx_net:
    name: db_dmx_dmx_network
    external: true
